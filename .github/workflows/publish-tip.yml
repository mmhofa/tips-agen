name: Publish agentic AI tips

on:
  schedule:
    - cron: "15 9,15,21 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-tip-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install project dependencies
        run: uv sync --locked

      - name: Generate and publish one tip
        id: publish
        env:
          AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: uv run python generate_tip.py

      - name: Persist posted-tip memory
        if: always() && steps.publish.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_tips.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: save posted-tip memory"
            git push
          fi
